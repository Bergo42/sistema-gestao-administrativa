name: Django CI

on:
  push:
    branches: [main, security/protect-secret-key]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install Django==5.2.19 coverage==7.17.3

      - name: Verificar configuracao do Django
        run: python manage.py check

      - name: Executar testes automatizados
        run: coverage run manage.py test

      - name: Exibir cobertura dos testes
        run: coverage report